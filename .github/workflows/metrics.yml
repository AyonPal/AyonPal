name: Metrics
on:
  # Schedule daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
  push:
    branches: ["master", "main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          # Your Personal Access Token with private repo access
          token: ${{ secrets.METRICS_TOKEN }}

          # User details
          user: AyonPal
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          # Output file path
          output_action: commit
          committer_message: "chore: update metrics [skip ci]"

          # --- PLUGINS ---

          # Language stats (includes private repos without leaking repo names)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Lines of code changed (fast, uses GraphQL without cloning!)
          plugin_lines: yes
          plugin_lines_history_limit: 1

          # 3D Isometric contribution calendar (optional, looks very sleek)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Coding habits (active hours, days of week, recent activity charts)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic

          # Recent activity feed
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all

          # Issues and Pull Requests followup overview
          plugin_followup: yes
          plugin_followup_sections: overview
